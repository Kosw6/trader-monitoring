global:
  scrape_interval: 5s
  evaluation_interval: 5s

scrape_configs:
  # ── Spring Boot Actuator (Micrometer) ────────────────────────────────────
  - job_name: app
    metrics_path: /actuator/prometheus
    static_configs:
      - targets:
          - "app-1:8080"   # publisher (volatile relay 발신)
          - "app-2:8080"   # receiver  (gRPC inbound / realtime_relay_inbound_total)

  - job_name: app-node
    static_configs:
      - targets:
          - "node-exporter:9100"

  - job_name: app-cadvisor
    static_configs:
      - targets:
          - "cadvisor:8080"

  - job_name: loki-node
    static_configs:
      - targets:
          - "13.125.1.176:9100"

  - job_name: loki-cadvisor
    static_configs:
      - targets:
          - "13.125.1.176:8081"

  - job_name: elk-node
    static_configs:
      - targets:
          - "43.202.33.230:9100"

  - job_name: elk-cadvisor
    static_configs:
      - targets:
          - "43.202.33.230:8081"
