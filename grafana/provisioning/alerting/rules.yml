apiVersion: 1

groups:
  - orgId: 1
    name: soft-recovery
    folder: Recovery
    interval: 30s
    rules:

      # ── app-1 down ──────────────────────────────────────────────────────────
      - uid: soft-recovery-app1
        title: "[SoftRecovery] app-1 down"
        condition: C
        data:
          - refId: A
            relativeTimeRange:
              from: 120
              to: 0
            datasourceUid: PBFA97CFB590B2093
            model:
              expr: up{job="app", instance="app-1:8080"}
              refId: A
              instant: false
          - refId: C
            relativeTimeRange:
              from: 0
              to: 0
            datasourceUid: __expr__
            model:
              type: threshold
              refId: C
              expression: A
              conditions:
                - type: query
                  evaluator:
                    type: lt
                    params: [1]
                  operator:
                    type: and
                  query:
                    params: [A]
                  reducer:
                    type: last
                    params: []
        noDataState: Alerting
        execErrState: Alerting
        for: 30s
        labels:
          severity: critical
          container: app-1
        annotations:
          summary: "app-1 container is unreachable"
          description: "Prometheus scrape 실패. SSM soft recovery 실행됨."
        isPaused: false
        notificationSettings:
          receiver: lambda-soft-recovery

      # ── app-2 down ──────────────────────────────────────────────────────────
      - uid: soft-recovery-app2
        title: "[SoftRecovery] app-2 down"
        condition: C
        data:
          - refId: A
            relativeTimeRange:
              from: 120
              to: 0
            datasourceUid: PBFA97CFB590B2093
            model:
              expr: up{job="app", instance="app-2:8080"}
              refId: A
              instant: false
          - refId: C
            relativeTimeRange:
              from: 0
              to: 0
            datasourceUid: __expr__
            model:
              type: threshold
              refId: C
              expression: A
              conditions:
                - type: query
                  evaluator:
                    type: lt
                    params: [1]
                  operator:
                    type: and
                  query:
                    params: [A]
                  reducer:
                    type: last
                    params: []
        noDataState: Alerting
        execErrState: Alerting
        for: 30s
        labels:
          severity: critical
          container: app-2
        annotations:
          summary: "app-2 container is unreachable"
          description: "Prometheus scrape 실패. SSM soft recovery 실행됨."
        isPaused: false
        notificationSettings:
          receiver: lambda-soft-recovery
